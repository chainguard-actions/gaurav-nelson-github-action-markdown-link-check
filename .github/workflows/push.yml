on: [pull_request]
name: PR Checks
permissions: {}
jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
    - name: markdown-link-check
      uses: ./
      with:
        check-modified-files-only: 'yes'
      id: markdown-link-check
    - name: display errors
      env:
        MLC_OUTPUT: ${{ steps.markdown-link-check.outputs.MLC_OUTPUT }}
      run: |
          echo "$MLC_OUTPUT"

  markdown-link-check-folders:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
    - name: markdown-link-check
      uses: ./
      with:
        # Add a test to restrict the test to just dir4 and dir5.
        folder-path: './md/dir4, ./md/dir5'
        file-path: './md/AdditionalFileTest1.md, ./md/AdditionalFileTest2.md'
  shellcheck:
    runs-on: [ubuntu-latest]
    steps:
      - uses: 'bewuethr/shellcheck-action@80bac2daa9fcf95d648200a793d00060857e6dc4' # v2
