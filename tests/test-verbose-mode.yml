name: Test verbose mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          use-quiet-mode: 'no'
          use-verbose-mode: 'yes'
          config-file: 'tests/fixtures/mlc_config_ignore_external.json'
          folder-path: 'tests/fixtures/valid-docs'
          max-depth: '1'
          check-modified-files-only: 'no'
          file-extension: '.md'

      - name: Assert MLC_OUTPUT indicates success in verbose mode
        env:
          ACTUAL: ${{ steps.action.outputs.MLC_OUTPUT }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: MLC_OUTPUT is empty, expected a success message"
            exit 1
          fi
          echo "PASS: got output '$ACTUAL'"
