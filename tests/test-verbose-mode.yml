name: Test verbose mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test markdown file with valid anchor links
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-verbose"
          cat > "$GITHUB_WORKSPACE/tests/tmp-verbose/test.md" <<'EOF'
          # Verbose Mode Test

          ## Overview

          This file tests verbose mode.

          [Overview](#overview)
          EOF

      - id: action
        uses: .
        with:
          use-quiet-mode: 'no'
          use-verbose-mode: 'yes'
          config-file: 'tests/fixtures/mlc_config_no_network.json'
          folder-path: 'tests/tmp-verbose'
          max-depth: '1'
          check-modified-files-only: 'no'
          file-extension: '.md'

      - name: Assert action succeeded in verbose mode
        run: |
          echo "PASS: markdown-link-check completed successfully in verbose mode"
