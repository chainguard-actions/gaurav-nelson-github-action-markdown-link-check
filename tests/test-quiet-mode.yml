name: Test quiet mode markdown link check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          file-path: 'tests/fixtures/valid-links.md'
          folder-path: 'tests/fixtures'
          file-extension: '.md'
          max-depth: '1'

      - name: Assert output indicates success in quiet mode
        env:
          ACTUAL: ${{ steps.action.outputs.MLC_OUTPUT }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected MLC_OUTPUT to be set"
            exit 1
          fi
          if echo "$ACTUAL" | grep -qi "ERROR"; then
            echo "FAIL: unexpected errors in output: $ACTUAL"
            exit 1
          fi
          echo "PASS: quiet mode succeeded with: $ACTUAL"
