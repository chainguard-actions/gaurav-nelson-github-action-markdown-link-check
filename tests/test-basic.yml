name: Test basic markdown link check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a markdown file with valid links
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-md"
          cat > "$GITHUB_WORKSPACE/test-md/README.md" <<'EOF'
          # Test Markdown

          This is a test file with no external links.
          EOF
      - id: action
        uses: .
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          folder-path: './test-md'
          max-depth: '1'
      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
