name: Test basic markdown link check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test markdown file with valid anchor links
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-basic"
          cat > "$GITHUB_WORKSPACE/tests/tmp-basic/test.md" <<'EOF'
          # Test Document

          ## Section One

          Some content here.

          ## Section Two

          - [Section One](#section-one)
          - [Section Two](#section-two)
          EOF

      - id: action
        uses: .
        with:
          use-quiet-mode: 'no'
          use-verbose-mode: 'no'
          config-file: 'tests/fixtures/mlc_config_no_network.json'
          folder-path: 'tests/tmp-basic'
          max-depth: '1'
          check-modified-files-only: 'no'
          file-extension: '.md'

      - name: Assert action succeeded
        run: |
          echo "PASS: markdown-link-check completed successfully with valid links"
